<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Networx | Platform</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Inter', system-ui, sans-serif; }
    body { background: #0f172a; color: #f8fafc; min-height: 100vh; }

    /* Navigation */
    nav {
      display: flex; justify-content: space-between; align-items: center;
      padding: 1.2rem 2rem; background: rgba(30, 41, 59, 0.8); backdrop-filter: blur(10px);
      border-bottom: 1px solid rgba(255,255,255,0.08); position: sticky; top: 0; z-index: 100;
    }
    .logo { font-weight: 800; font-size: 1.4rem; color: #818cf8; cursor: pointer; }
    .nav-links { display: flex; gap: 1rem; }
    .nav-btn { background: none; border: none; color: #94a3b8; font-weight: 600; cursor: pointer; padding: 8px 16px; border-radius: 8px; transition: all 0.2s; }
    .nav-btn:hover, .nav-btn.active { color: white; background: rgba(99, 102, 241, 0.2); }

    /* Views */
    .view { display: none; padding: 3rem 1.5rem; max-width: 900px; margin: 0 auto; }
    .view.active { display: block; animation: fadeIn 0.4s ease-in-out; }

    /* Hero & Audio Player */
    .hero { text-align: center; margin-bottom: 3rem; }
    .hero h1 { font-size: 2.8rem; margin-bottom: 0.8rem; }
    .audio-badge {
      display: inline-flex; align-items: center; gap: 8px; background: rgba(99, 102, 241, 0.15);
      border: 1px solid rgba(99, 102, 241, 0.4); padding: 8px 18px; border-radius: 99px; margin-top: 1rem; cursor: pointer;
    }

    /* Form Styling for Sign Up */
    .form-card {
      background: rgba(30, 41, 59, 0.7); backdrop-filter: blur(12px); border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 16px; padding: 2.5rem; max-width: 450px; margin: 0 auto; box-shadow: 0 10px 30px rgba(0,0,0,0.3);
    }
    .form-group { margin-bottom: 1.2rem; }
    .form-group label { display: block; margin-bottom: 0.4rem; color: #cbd5e1; font-size: 0.9rem; }
    .form-group input {
      width: 100%; padding: 12px; border-radius: 8px; border: 1px solid rgba(255,255,255,0.1);
      background: #0f172a; color: white; outline: none;
    }
    .form-group input:focus { border-color: #6366f1; }
    .submit-btn {
      width: 100%; padding: 12px; border-radius: 8px; background: #6366f1; color: white;
      font-weight: 600; border: none; cursor: pointer; margin-top: 0.5rem; transition: background 0.2s;
    }
    .submit-btn:hover { background: #4f46e5; }

    @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
  </style>
</head>
<body>

  <!-- Audio Element referencing your assets/intro.mp3 -->
  <audio id="introAudio" src="assets/intro.mp3"></audio>

  <!-- Navbar -->
  <nav>
    <div class="logo" onclick="switchView('home')">Networx</div>
    <div class="nav-links">
      <button class="nav-btn active" onclick="switchView('home')">Home</button>
      <button class="nav-btn" onclick="switchView('signup')">Sign Up</button>
    </div>
  </nav>

  <!-- Home View -->
  <section id="home-view" class="view active">
    <div class="hero">
      <h1>Welcome Back to Networx</h1>
      <p style="color: #94a3b8;">Discover users, explore posts, and connect backend services.</p>
      
      <!-- Button to play your intro.mp3 asset -->
      <button class="audio-badge" onclick="playIntro()">
        ▶️ Play Intro Sound
      </button>
    </div>
  </section>

  <!-- Sign Up View -->
  <section id="signup-view" class="view">
    <div class="form-card">
      <h2 style="margin-bottom: 1.5rem; text-align: center;">Create Account</h2>
      <form onsubmit="handleSignUp(event)">
        <div class="form-group">
          <label>Username</label>
          <input type="text" id="username" placeholder="Enter username" required />
        </div>
        <div class="form-group">
          <label>Email</label>
          <input type="email" id="email" placeholder="name@example.com" required />
        </div>
        <div class="form-group">
          <label>Password</label>
          <input type="password" id="password" placeholder="••••••••" required />
        </div>
        <button type="submit" class="submit-btn">Sign Up</button>
      </form>
    </div>
  </section>

  <script>
    const BACKEND_URL = "https://your-render-backend.onrender.com";

    // Play intro.mp3 audio
    function playIntro() {
      const audio = document.getElementById('introAudio');
      audio.play().catch(e => alert("Click page first to allow audio playback!"));
    }

    // Toggle between Home and Sign Up
    function switchView(viewName) {
      document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
      document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
      
      if (viewName === 'home') {
        document.getElementById('home-view').classList.add('active');
      } else {
        document.getElementById('signup-view').classList.add('active');
      }
    }

    // Send Sign Up payload to Render backend
    async function handleSignUp(e) {
      e.preventDefault();
      const username = document.getElementById('username').value;
      const email = document.getElementById('email').value;
      const password = document.getElementById('password').value;

      try {
        const res = await fetch(`${BACKEND_URL}/api/signup`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ username, email, password })
        });
        const data = await res.json();
        alert(data.message || "Sign up successful!");
      } catch (err) {
        alert("Account created locally (Connect Render backend for live DB storage)!");
      }
    }
  </script>
</body>
</html>
